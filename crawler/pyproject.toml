[project]
name = "crawler-service"
version = "0.1.0"
description = "台股盤後資料爬蟲服務"
requires-python = ">=3.12"

dependencies = [
  # HTTP 客戶端
  "httpx[http2]>=0.27",
  # 資料庫 ORM
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  # 資料驗證
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  # 日誌
  "loguru>=0.7",
  # 重試機制
  "tenacity>=8.0",
  # RSS 解析
  "feedparser>=6.0",
  # HTML 解析
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  # 驗證碼 OCR（BSR 分點爬蟲用）
  "ddddocr>=1.5",
  # 進度條（回填腳本用）
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=pipeline.cleaner --cov=pipeline.validator --cov=monitor.alert --cov=crawlers.news.deduplicator --cov=crawlers.news.stock_mention_extractor --cov=crawlers.base.base_crawler --cov=analytics.technical --cov=analytics.strength --cov-report=term-missing --cov-fail-under=80"
