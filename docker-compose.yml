# 本機自架。所有容器設 mem_limit；對外只開 web（8080），admin 與 DB 只綁 127.0.0.1。

volumes:
  db_data:

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?}
      NO_TS_TUNE: "true"
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=30
      -c timescaledb.max_background_workers=4
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://api:${API_DB_PASSWORD}@db:5432/hub
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  crawler:
    build: ./crawler
    environment:
      DATABASE_URL: postgresql+asyncpg://crawler:${CRAWLER_DB_PASSWORD}@db:5432/hub
      FINMIND_TOKEN: ${FINMIND_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./crawler/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    # ponytail: 峰值來自分點爬蟲的 ddddocr（onnxruntime）；閒置時只剩 supercronic
    mem_limit: 1g
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?}
      NGINX_ENVSUBST_FILTER: ADMIN_API_KEY
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped
